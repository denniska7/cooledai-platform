# ── CooledAI Production Configuration ───────────────────────────
# This file replaces scattered environment variables with a single,
# schema-validated configuration source.  Env vars still override
# any value here (pattern: COOLEDAI_<SECTION>_<KEY>).

server:
  client_name: ""           # Required: e.g. "Acme Corp"
  site: ""                  # Required: e.g. "US-East-1"
  rack: ""                  # Required: e.g. "R42"
  tls_cert_path: ""         # Optional: path to TLS cert for expiry check
  require_https: false      # Set true in production

hardware:
  gpu_count: 2
  gpu_model: ""             # OPTIONAL metadata — not used in optimization logic
  max_fan_rpm: 7000

features:
  gpu_governor: true
  xcc_control: true
  cpu_thermal_guard: true

alerts:
  warning_temp_c: 65
  critical_temp_c: 85
  shutdown_temp_c: 95       # Triggers emergency reset (gpu_governor + xcc auto)
  webhook_url: ""           # Optional: POST JSON notification on state change
  email: ""                 # Optional: email notification target

calibration:
  profile_backup_path: "/var/lib/cooledai/calibration_backup.json"

audit:
  log_path: "/var/log/cooledai/audit.log"
  retention_days: 90

auth:
  key_expiry_days: 90
  key_warning_days: 75
  rate_limit_per_minute: 60

telemetry:
  strict_whitelist: false   # true = reject unknown fields; false = strip + warn

billing:
  electricity_rate: 0.12              # $/kWh — overridden by env COOLEDAI_UTILITY_RATE
  currency: "USD"                     # Display currency for dashboard
  grid_carbon_intensity_kg_per_kwh: 0.386  # US grid average for ESG reporting
