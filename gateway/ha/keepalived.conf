# CooledAI Edge Gateway — Keepalived VRRP Configuration Template
#
# DEFERRED: This template is not wired into gateway startup.
# Activate when HA is needed (after Steps 1-7 validated in production).
#
# Deploy on BOTH primary and standby gateway hosts.
# Primary: state MASTER, priority 100
# Standby: state BACKUP, priority 50
#
# Agents always connect to the Virtual IP (192.168.1.50).
# On failover, keepalived moves the VIP to the standby in <30s.

vrrp_script check_gateway {
    script "/usr/local/bin/check_cooledai_gateway.sh"
    interval 5
    weight -20
    fall 3          # 3 consecutive failures = demote
    rise 2          # 2 consecutive successes = promote
}

vrrp_instance COOLEDAI_GW {
    state MASTER                    # MASTER on primary, BACKUP on standby
    interface eth0                  # Management NIC (adjust for your environment)
    virtual_router_id 51
    priority 100                    # 100 on primary, 50 on standby
    advert_int 5                    # Heartbeat every 5 seconds

    authentication {
        auth_type PASS
        auth_pass cooledai_ha       # Change in production!
    }

    virtual_ipaddress {
        192.168.1.50/24             # Virtual IP — agents connect to this
    }

    track_script {
        check_gateway
    }
}
